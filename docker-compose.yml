services:
  postgres:
    image: postgres:16-alpine
    container_name: egp-trust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: egp
      POSTGRES_PASSWORD: egp
      POSTGRES_DB: egp_trust
    ports:
      - "5432:5432"
    volumes:
      - egp_trust_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egp -d egp_trust"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  egp_trust_postgres_data:
